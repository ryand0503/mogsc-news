<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOGSC – Malaysia O&G News</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f4f4;color:#1a1a1a;padding:16px;}

  /* HEADER */
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .hdr-left{display:flex;align-items:center;gap:10px;}
  .live-dot{width:9px;height:9px;border-radius:50%;background:#16a34a;flex-shrink:0;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .hdr-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1a1a1a;}
  .hdr-edition{font-size:11px;color:#666;margin-top:1px;}
  .mogsc-badge{background:#c0111f;color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:4px;text-transform:uppercase;}
  .refresh-btn{background:none;border:none;cursor:pointer;color:#888;font-size:16px;line-height:1;padding:4px;border-radius:4px;transition:color .2s;}
  .refresh-btn:hover{color:#c0111f;}

  /* HERO CAROUSEL */
  .hero-wrap{position:relative;border-radius:10px;overflow:hidden;margin-bottom:16px;background:#222;cursor:pointer;}
  .hero-slides{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .hero-slide{min-width:100%;position:relative;height:200px;flex-shrink:0;}
  .hero-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.2) 55%,transparent 100%);}
  .hero-src{position:absolute;top:12px;left:12px;background:#c0111f;color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
  .hero-body{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;}
  .hero-title{font-size:16px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .hero-meta{font-size:11px;color:rgba(255,255,255,.7);}
  .hero-dots{position:absolute;bottom:12px;right:14px;display:flex;gap:5px;align-items:center;}
  .hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .2s,transform .2s;cursor:pointer;}
  .hero-dot.active{background:#fff;transform:scale(1.3);}
  .hero-skel{height:200px;border-radius:10px;background:linear-gradient(90deg,#ddd 25%,#eee 50%,#ddd 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:16px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* MORE NEWS GRID */
  .more-hdr{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:10px;}
  .news-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ntile{background:#fff;border-radius:8px;overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s;border:1px solid #e8e8e8;}
  .ntile:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px);}
  .ntile-img{width:100%;height:100px;overflow:hidden;background:#b8001e;position:relative;flex-shrink:0;}
  .ntile-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .ntile-img-fallback{width:100%;height:100%;object-fit:cover;display:block;}
  .ntile-body{padding:10px 12px;}
  .ntile-tag{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#c0111f;margin-bottom:4px;}
  .ntile-title{font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px;}
  .ntile-meta{font-size:10px;color:#888;}
  .ntile-skel{height:180px;border-radius:8px;background:linear-gradient(90deg,#ddd 25%,#eee 50%,#ddd 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
  .no-feed{grid-column:1/-1;text-align:center;padding:24px;color:#aaa;font-size:12px;}

  @media(max-width:500px){.news-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <div class="live-dot"></div>
    <div>
      <div class="hdr-title">Malaysia O&amp;G &amp; MOGSC News</div>
      <div class="hdr-edition" id="editionDate">Loading…</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="mogsc-badge">MOGSC</span>
    <button class="refresh-btn" onclick="loadAll()" title="Refresh">↻</button>
  </div>
</div>

<!-- HERO CAROUSEL -->
<div id="heroSkel" class="hero-skel"></div>
<div class="hero-wrap" id="heroWrap" style="display:none" onclick="heroClick()">
  <div class="hero-slides" id="heroSlides"></div>
  <div class="hero-dots" id="heroDots"></div>
</div>

<!-- MORE NEWS -->
<div class="more-hdr">More Industry News</div>
<div class="news-grid" id="newsGrid">
  <div class="ntile-skel"></div>
  <div class="ntile-skel"></div>
  <div class="ntile-skel"></div>
  <div class="ntile-skel"></div>
</div>

<script>
var PROXY='https://api.rss2json.com/v1/api.json?rss_url=';
function reg(tag){
  return PROXY+encodeURIComponent(
    'https://api.theregister.com/api/v1/article?query=tag:'+encodeURIComponent(tag)+
    '&orderBy=published&site_id=2&remapper=rss&limit=20&_cb='+Date.now()
  );
}
var FEEDS=[
  reg('energy'),
  reg('science'),
  reg('cloud'),
  reg('software'),
  'https://www.reddit.com/r/energy.rss?limit=20',
  'https://www.reddit.com/r/worldnews+energy+business.rss?limit=20'
];

var FALLBACK_ITEMS=[
  {title:'MOGSC 2026 — Malaysia O&G Services Sector Outlook',link:'https://www.mogsc.org',pubDate:new Date().toISOString(),source:'MOGSC'},
  {title:'PETRONAS Awards New Upstream Contracts in Malaysia',link:'https://www.petronas.com',pubDate:new Date(Date.now()-86400000).toISOString(),source:'PETRONAS'},
  {title:'Malaysia Oil & Gas Sector Targets RM 30B Revenue in 2026',link:'#',pubDate:new Date(Date.now()-2*86400000).toISOString(),source:'Industry'},
  {title:'MUPEX 2026 — Upstream Petroleum Exhibition Preview',link:'#',pubDate:new Date(Date.now()-3*86400000).toISOString(),source:'MUPEX'},
  {title:'OGA 2026 Conference Highlights Malaysia Energy Transition',link:'#',pubDate:new Date(Date.now()-4*86400000).toISOString(),source:'OGA'},
  {title:'Malaysian Oil Services Companies Report Strong Q2 2026 Results',link:'#',pubDate:new Date(Date.now()-5*86400000).toISOString(),source:'Bursa'},
  {title:'Sarawak Onshore Production Milestone — AKW First Oil Achieved',link:'#',pubDate:new Date(Date.now()-6*86400000).toISOString(),source:'Upstream'},
  {title:'Malaysia Advances Renewable Energy Integration in Offshore Operations',link:'#',pubDate:new Date(Date.now()-7*86400000).toISOString(),source:'Energy'},
  {title:'MOGSC Membership Drive 2026 — Supporting Malaysian O&G Services',link:'https://www.mogsc.org',pubDate:new Date(Date.now()-8*86400000).toISOString(),source:'MOGSC'},
  {title:'Asia Pacific LNG Demand Growth Supports Malaysia Upstream Investment',link:'#',pubDate:new Date(Date.now()-9*86400000).toISOString(),source:'LNG World'},
  {title:'PETRONAS Carigali Expands HUC Contracts for Malaysia Shelf Projects',link:'#',pubDate:new Date(Date.now()-10*86400000).toISOString(),source:'Upstream'}
];

var _items=[];
var _heroIdx=0;
var _heroTimer=null;

var OG_IMGS=[
  'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=600&q=80',
  'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80',
  'https://images.unsplash.com/photo-1586953208448-b95a79798f07?w=600&q=80',
  'https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=600&q=80',
  'https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?w=600&q=80',
  'https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?w=600&q=80',
  'https://images.unsplash.com/photo-1581091226033-d5c48150dbaa?w=600&q=80',
  'https://images.unsplash.com/photo-1545259741-2ea3ebf61fa3?w=600&q=80'
];

function timeAgo(d){
  var s=(Date.now()-new Date(d))/1000;
  if(s<60)return 'Just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function extractImg(item){
  return (item.thumbnail&&item.thumbnail.startsWith('http'))?item.thumbnail
    :(item.enclosure&&item.enclosure.link&&item.enclosure.link.match(/\.(jpg|jpeg|png|webp)/i))?item.enclosure.link
    :((item.description||'').match(/<img[^>]+src=["']([^"']+)["']/i)||[])[1]
    ||((item.content||'').match(/<img[^>]+src=["']([^"']+)["']/i)||[])[1]
    ||'';
}

function setEditionDate(){
  var d=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('editionDate').textContent='Edition '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

function buildHero(items){
  var slides=document.getElementById('heroSlides');
  var dots=document.getElementById('heroDots');
  slides.innerHTML=items.slice(0,5).map(function(item,i){
    var img=extractImg(item);
    var src=(item.source||item.author||'News').replace(/</g,'&lt;');
    var ago=timeAgo(item.pubDate||new Date());
    var fb=OG_IMGS[i%OG_IMGS.length];
    return '<div class="hero-slide">'
      +(img
        ?'<img src="'+img+'" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.src=\''+fb+'\'">'
        :'<img src="'+fb+'" alt="" style="width:100%;height:100%;object-fit:cover;">')
      +'<div class="hero-grad"></div>'
      +'<div class="hero-src">'+src+'</div>'
      +'<div class="hero-body">'
        +'<div class="hero-title">'+(item.title||'').replace(/</g,'&lt;')+'</div>'
        +'<div class="hero-meta">'+src+' · '+ago+'</div>'
      +'</div>'
      +'</div>';
  }).join('');
  var count=Math.min(items.length,5);
  dots.innerHTML=Array.from({length:count},function(_,i){
    return '<div class="hero-dot'+(i===0?' active':'')+'" onclick="event.stopPropagation();goHero('+i+')"></div>';
  }).join('');
  document.getElementById('heroSkel').style.display='none';
  document.getElementById('heroWrap').style.display='block';
  startHeroAuto();
}

function goHero(idx){
  _heroIdx=idx;
  document.getElementById('heroSlides').style.transform='translateX(-'+idx*100+'%)';
  document.querySelectorAll('.hero-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
}

function startHeroAuto(){
  clearInterval(_heroTimer);
  _heroTimer=setInterval(function(){
    var count=document.querySelectorAll('.hero-slide').length;
    goHero((_heroIdx+1)%count);
  },4500);
}

function heroClick(){
  var item=_items[_heroIdx];
  if(item&&item.link)window.open(item.link,'_blank');
}

function buildGrid(items){
  var grid=document.getElementById('newsGrid');
  var tiles=items.slice(5,11);
  if(!tiles.length){grid.innerHTML='<div class="no-feed">No articles available</div>';return;}
  grid.innerHTML=tiles.map(function(item,idx){
    var img=extractImg(item);
    var src=(item.source||item.author||'News').replace(/</g,'&lt;');
    var ago=timeAgo(item.pubDate||new Date());
    var url=item.link||'#';
    var fallbackImg=OG_IMGS[idx%OG_IMGS.length];
    return '<div class="ntile" onclick="window.open(\''+url+'\',\'_blank\')">'
      +'<div class="ntile-img">'
        +(img
          ?'<img src="'+img+'" alt="" loading="lazy" onerror="this.src=\''+fallbackImg+'\'">'
          :'<img src="'+fallbackImg+'" alt="" loading="lazy">')
      +'</div>'
      +'<div class="ntile-body">'
        +'<div class="ntile-tag">'+src+'</div>'
        +'<div class="ntile-title">'+(item.title||'').replace(/</g,'&lt;')+'</div>'
        +'<div class="ntile-meta">'+ago+'</div>'
      +'</div>'
      +'</div>';
  }).join('');
}

function tryFeed(idx){
  if(idx>=FEEDS.length){
    _items=FALLBACK_ITEMS;
    buildHero(FALLBACK_ITEMS);
    buildGrid(FALLBACK_ITEMS);
    return;
  }
  var url=typeof FEEDS[idx]==='string'?PROXY+encodeURIComponent(FEEDS[idx])+'&count=20':FEEDS[idx];
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.items&&d.items.length>=3){
        _items=d.items;
        buildHero(d.items);
        buildGrid(d.items);
      } else {
        tryFeed(idx+1);
      }
    })
    .catch(function(){tryFeed(idx+1);});
}

function loadAll(){
  _heroIdx=0;
  clearInterval(_heroTimer);
  document.getElementById('heroSkel').style.display='block';
  document.getElementById('heroWrap').style.display='none';
  document.getElementById('newsGrid').innerHTML='<div class="ntile-skel"></div><div class="ntile-skel"></div><div class="ntile-skel"></div><div class="ntile-skel"></div>';
  setEditionDate();
  tryFeed(0);
}

loadAll();
setInterval(loadAll,600000);
</script>
</body>
</html>
